<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>地震マップ</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: "Yu Gothic","YuGothic","メイリオ",sans-serif;
}
#map { width: 100%; height: 100vh; }

.intensity-marker {
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  width:32px;
  height:32px;
  font-weight:bold;
  font-size:14px;
  border:2px solid rgba(0,0,0,0.2);
  box-sizing:border-box;
}

#loading {
  position:absolute;
  top:30px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:6px 12px;
  border:1px solid black;
  z-index:100000;
  font-weight:bold;
}

#hypo-info {
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(255,255,255,0.9);
  padding:8px 12px;
  border:1px solid black;
  z-index:100000;
  font-weight:bold;
  line-height:1.2;
}

#max-intensity {
  position:absolute;
  left:10px;
  border:1px solid black;
  text-align:center;
  z-index:100000;
  padding:4px 12px;
}

#max-intensity .label {
  font-size:0.85em;
}

#max-intensity .scale {
  font-size:2.2em;
  font-weight:bold;
}
</style>
</head>

<body>
<div id="map"></div>
<div id="loading">読み込み中…</div>
<div id="hypo-info"></div>

<div id="max-intensity">
  <div class="label">最大震度</div>
  <div class="scale">--</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
// ==================== 地図初期化 ====================
const map = L.map('map').setView([37.5, 138], 5);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  { attribution: '&copy; CARTO', maxZoom: 19 }
).addTo(map);

map.createPane('hypocenterPane');
map.getPane('hypocenterPane').style.zIndex = 10000;

// ==================== 定数 ====================
const colors = {
  "1":"#dcdcdc","2":"#00aaff","3":"#0041ff","4":"#fae696",
  "5-":"#ffe600","5+":"#ffc800","6-":"#ff2800",
  "6+":"#a50021","7":"#b40068"
};
const textColors = {
  "1":"#000","2":"#fff","3":"#fff","4":"#000",
  "5-":"#000","5+":"#fff","6-":"#fff","6+":"#fff","7":"#fff"
};
const p2pToShindo = {
  10:"1",20:"2",30:"3",40:"4",45:"5-",
  50:"5+",55:"6-",60:"6+",70:"7"
};

// ==================== 座標取得（gist API 経由） ====================
async function getCoordinates(names) {
  const res = await fetch(
    'https://api.github.com/gists/79005d1896631ad6117bbe327b8162c1'
  );
  if (!res.ok) throw new Error('coords fetch failed');

  const gist = await res.json();
  const file = Object.values(gist.files)[0];
  const list = JSON.parse(file.content);

  const dict = {};
  for (const item of list) {
    if (item.name && item.lat && item.lon) {
      dict[item.name] = {
        lat: Number(item.lat),
        lon: Number(item.lon)
      };
    }
  }

  const result = {};
  for (const name of names) {
    if (dict[name]) result[name] = dict[name];
  }
  return result;
}

// ==================== マーカー ====================
function addIntensityMarker(lat, lon, intensity, text){
  const icon = L.divIcon({
    className:'',
    html:`<div class="intensity-marker"
      style="background:${colors[intensity]};
      color:${textColors[intensity]}">${intensity}</div>`,
    iconSize:[32,32],
    iconAnchor:[16,16]
  });
  const m = L.marker([lat,lon], {icon}).addTo(map);
  if (text) m.bindPopup(text);
}

// ==================== 最大震度位置調整 ====================
function updateMaxIntensityPosition(){
  const info = document.getElementById('hypo-info');
  const maxI = document.getElementById('max-intensity');
  const r = info.getBoundingClientRect();
  maxI.style.top = (r.bottom + 5) + 'px';
}

// ==================== 地震情報取得 ====================
(async () => {
  try {
    const res = await fetch(
      'https://api.p2pquake.net/v2/history?codes=551&limit=5'
    );
    const data = await res.json();

    for (const eqData of data) {
      if (eqData.issue?.type !== "DetailScale") continue;

      const points = eqData.points;
      const names = points.map(p => p.addr);

      const coordMap = await getCoordinates(names);
      let bounds = [];

      points.forEach(p => {
        const c = coordMap[p.addr];
        const i = p2pToShindo[p.scale];
        if (c && i) {
          addIntensityMarker(c.lat, c.lon, i, p.addr);
          bounds.push([c.lat, c.lon]);
        }
      });

      const eq = eqData.earthquake;
      const hypo = eq.hypocenter;

      if (hypo?.latitude > -100 && hypo?.longitude > -100) {
        bounds.push([hypo.latitude, hypo.longitude]);

        const cross = L.divIcon({
          className:'',
          html:`<div style="width:30px;height:30px;
            position:relative;transform:rotate(45deg)">
            <div style="position:absolute;left:13px;
              width:4px;height:30px;background:red"></div>
            <div style="position:absolute;top:13px;
              width:30px;height:4px;background:red"></div>
          </div>`,
          iconSize:[30,30],
          iconAnchor:[15,15],
          pane:'hypocenterPane'
        });
        L.marker(
          [hypo.latitude, hypo.longitude],
          {icon:cross, interactive:false}
        ).addTo(map);
      }

      if (bounds.length) {
        map.fitBounds(bounds, {padding:[120,120], maxZoom:8});
      }

      document.getElementById('loading').style.display = 'none';

      const time = new Date(eq.time);
      document.getElementById('hypo-info').innerHTML =
        `${time.getFullYear()}/${time.getMonth()+1}/${time.getDate()}
         ${time.getHours()}:${String(time.getMinutes()).padStart(2,'0')}頃<br>
         ${hypo?.name || '震源地不明'}<br>
         M${hypo?.magnitude?.toFixed(1) ?? '不明'}
         深さ ${hypo?.depth ?? '不明'}km`;

      const scale = p2pToShindo[eq.maxScale] || '--';
      const maxI = document.getElementById('max-intensity');
      maxI.querySelector('.scale').textContent = scale;

      if (scale !== '--') {
        maxI.style.background = colors[scale];
        maxI.style.color = textColors[scale];
      }

      updateMaxIntensityPosition();
      window.addEventListener('resize', updateMaxIntensityPosition);

      break; // 最新1件のみ
    }
  } catch (e) {
    const loading = document.getElementById('loading');
    loading.innerHTML =
      '<b>エラー内容</b><br>' +
      (e?.message || e);
  }
})();
</script>
</body>
</html>
